name: osv-scanner
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
permissions: {}
concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # A pull request fails only on vulnerabilities it adds; the weekly run reports everything on main.
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
  main:
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
