reason = "deepmerge 4.3.1 has no fixed release. It is reached only through style-dictionary (dev dependency, via @bundled-es-modules/deepmerge), which merges our own token files at build time. Before the date: check for a deepmerge release or a style-dictionary that drops it."

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
