reason = "glob 13.0.6 is a production dependency of @sentry/nextjs (via @sentry/bundler-plugins) and of react-email, and a dev dependency of storybook and style-dictionary. The Sentry plugin globs our own build output at build time with patterns we set; whether react-email calls glob at runtime in our deployed code is not confirmed. Before the date: confirm that, and look for a glob 14 range in @sentry/nextjs, react-email or a pnpm override that installs cleanly."

[[IgnoredVulns]]
