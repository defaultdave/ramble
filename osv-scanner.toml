# Each entry stops being ignored on its ignoreUntil date, so the advisory comes back for a decision.
# An override is no fix here: deepmerge has no fixed release, and the fixed glob (14.0.2) and
# minimatch (11.0.1) are major bumps that the parents below do not accept.
# Chains are from `pnpm why`; rerun it before renewing an entry.

[[IgnoredVulns]]
